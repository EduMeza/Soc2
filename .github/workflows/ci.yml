name: CI

# Valida el proyecto en cada Pull Request dirigido a main.
# Solo se ejecutan comprobaciones locales y deterministas: no requiere
# secretos, credenciales, bases de datos ni servicios externos (Wazuh, APIs).
on:
  pull_request:
    branches: [main]

# Minimiza permisos: el workflow solo necesita leer el codigo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Python 3.11: minimo declarado en requirements.txt y scripts/setup.ps1.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      # Comprueba solo la sintaxis: compila los .py del repositorio sin importar
      # ni ejecutar el codigo, por lo que no toca bases de datos ni credenciales.
      - name: Check Python syntax
        run: python -m compileall -q -x '(node_modules|venv|\.venv|\.git)' .

      # Ejecuta tests aislados con base de datos temporal.
      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node 22: cumple los engines de Vite 6 (^18 || ^20 || >=22) y de React 19.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci instala exactamente lo que fija package-lock.json
      # y falla si el lockfile esta desincronizado con package.json.
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
