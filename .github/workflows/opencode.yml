name: OpenCode Agent Workflow

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  run-opencode:
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenCode Agent
        uses: anomalyco/opencode-actions/run@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_MODEL: openai/gpt-4o # Usará el modelo inteligente GPT-4o de OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Llama al secreto seguro que guardamos en GitHub

